# Perfil de container (e, por heranca, de producao).

# Log estruturado em JSON. Em producao ninguem le log com os olhos: o formato
# existe para ser filtrado por campo — provedor, id do chamado, motivo da falha.
# ECS (Elastic Common Schema) por ser o formato que Elastic, Grafana Loki e a
# maioria dos agentes entendem sem configuracao extra. O Spring Boot 4 traz isso
# nativo: nao ha logback.xml neste projeto.
logging.structured.format.console=ecs

# Sem detalhes de health para quem nao esta autenticado: a lista de dependencias
# e o que elas respondem e informacao util para quem quer atacar o sistema.
management.endpoint.health.show-details=never
