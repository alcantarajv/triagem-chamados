spring.application.name=triagem

# Le o .env da pasta do projeto quando ele existe, para que "mvnw spring-boot:run"
# enxergue a chave do Gemini sem exportar variavel na mao. Variaveis de ambiente
# de verdade continuam valendo mais: no Render, o painel manda.
spring.config.import=optional:file:.env[.properties]

# O perfil "prod" herda tudo do "docker". Em vez de repetir as mesmas linhas num
# application-prod.properties, o grupo faz o prod incluir o docker.
spring.profiles.group.prod=docker

# Plataformas de deploy injetam a porta por variavel de ambiente e esperam que a
# aplicacao a respeite. Sem isto, o servico sobe na 8080, a plataforma procura em
# outra porta, o health check falha e o deploy e revertido.
server.port=${PORT:8080}

# --- Banco ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triagem}
spring.datasource.username=${DB_USERNAME:triagem}
spring.datasource.password=${DB_PASSWORD:triagem}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}

# --- JPA ---
# O schema e responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Aplicacao inteira em UTC, independente do fuso da maquina ---
# Jackson na serializacao e Hibernate na leitura e escrita de TIMESTAMPTZ. Sem a
# segunda linha, o Hibernate converte usando o fuso da JVM, e o mesmo instante
# pode ser gravado de forma diferente no notebook e no servidor.
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Problem Details (RFC 9457) nas respostas de erro ---
spring.mvc.problemdetails.enabled=true

# --- Actuator ---
# O health agrega automaticamente o estado do banco: "a aplicacao esta de pe" so
# e verdade se o PostgreSQL estiver respondendo, porque e nele que o chamado e
# gravado antes de qualquer triagem.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_DETAILS:always}

# --- Metricas ---
# Prometheus entra na exposicao; o /actuator/metrics, que navega metrica por
# metrica, fica de fora: o formato Prometheus ja traz tudo numa pagina so. As
# metricas contam volumes, latencias e falhas, nunca texto de chamado nem IP.
management.endpoints.web.exposure.include=health,info,prometheus
# Toda metrica sai marcada com a aplicacao, para conviver com outras no mesmo
# Prometheus sem virar soma de coisas diferentes.
management.metrics.tags.aplicacao=triagem
# Histograma das latencias. Media esconde o que importa: um provedor pode ter
# media de 2s com 5% das chamadas batendo no tempo limite de 15s. Com o
# histograma, o Prometheus calcula o percentil 95 e o 99.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.triagem.provedor.requisicoes=true
management.metrics.distribution.percentiles-histogram.triagem.triagens=true

# --- Provedores de IA ---
# Dois provedores, consultados nesta ordem: o Gemini e o principal, o Groq e o
# fallback (ver PropriedadesDosProvedores#emOrdem). Os dois pelo endpoint
# compativel com a API da OpenAI; as URLs sao configuraveis para que os testes
# apontem para o WireMock.
#
# As chaves nao tem valor padrao de verdade: so existem no .env local e no painel
# do Render. Provedor sem chave fica fora da cadeia; sem nenhum, a aplicacao sobe
# e os chamados vao para triagem manual (ver ConfiguracaoDosProvedores).

# Gemini
triagem.provedores.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
triagem.provedores.gemini.chave=${GEMINI_API_KEY:}
# Flash-Lite: o mais rapido e barato da linha, com plano gratuito. Classificar
# um chamado em cinco categorias nao pede o modelo mais capaz.
triagem.provedores.gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
# Tempo maximo de uma chamada. O padrao do SDK e 60 segundos — um minuto com o
# worker parado por um provedor que talvez nem responda. O flash-lite responde
# em 1 a 5 segundos; 15 deixa folga para o dia ruim sem esperar o dia pessimo.
triagem.provedores.gemini.tempo-limite=${GEMINI_TEMPO_LIMITE:15s}
triagem.provedores.gemini.esforco-de-raciocinio=${GEMINI_ESFORCO_DE_RACIOCINIO:}
# A cota gratuita e de 500 requisicoes por dia, e o dia dela vira a meia-noite do
# Pacifico (o painel do AI Studio mostra o eixo em UTC-8). Orcamento de 450: a
# folga cobre o que for usado fora da aplicacao, como testes manuais.
triagem.provedores.gemini.orcamento-diario=${GEMINI_ORCAMENTO_DIARIO:450}
triagem.provedores.gemini.fuso-do-orcamento=America/Los_Angeles

# Groq
triagem.provedores.groq.url=${GROQ_URL:https://api.groq.com/openai/v1}
triagem.provedores.groq.chave=${GROQ_API_KEY:}
# Um dos poucos modelos do Groq com saida estruturada em modo estrito (o JSON
# respeita o esquema, e nao so a sintaxe). Os demais so garantem JSON valido.
triagem.provedores.groq.modelo=${GROQ_MODELO:openai/gpt-oss-20b}
triagem.provedores.groq.tempo-limite=${GROQ_TEMPO_LIMITE:15s}
# O gpt-oss raciocina antes de responder, e o raciocinio e cobrado em tokens. No
# plano gratuito o limite que aperta no Groq e o de 8 mil tokens por minuto, e
# classificar um chamado nao pede raciocinio longo.
triagem.provedores.groq.esforco-de-raciocinio=${GROQ_ESFORCO_DE_RACIOCINIO:low}
# Cota gratuita de 1.000 requisicoes por dia. O Groq nao documenta o fuso da
# virada; UTC, com folga de 10% para a diferenca.
triagem.provedores.groq.orcamento-diario=${GROQ_ORCAMENTO_DIARIO:900}
triagem.provedores.groq.fuso-do-orcamento=UTC

# --- Circuit breaker, um por provedor ---
# Cinco falhas seguidas abrem o circuito: durante um minuto o provedor e pulado
# sem requisicao nenhuma, e a vez passa direto ao proximo. Depois, uma chamada de
# teste decide se ele volta.
triagem.disjuntor.falhas-seguidas=${DISJUNTOR_FALHAS_SEGUIDAS:5}
triagem.disjuntor.tempo-aberto=${DISJUNTOR_TEMPO_ABERTO:60s}

# --- Controle de custo ---
# O mesmo texto (ignorando maiusculas, acentos e espacos) reaproveita a
# classificacao guardada por 30 dias, sem chamar provedor.
triagem.custo.validade-do-cache=${CACHE_VALIDADE:30d}
# Cada chamado registrado vira pelo menos uma requisicao a um provedor, e a cota
# diaria e de todos os visitantes da demonstracao.
triagem.custo.chamados-por-hora=${LIMITE_CHAMADOS_POR_HORA:10}
# De onde vem o IP do cliente. Localmente a conexao chega direto: 0 proxies e
# nenhum cabecalho. Em producao, o que vale foi medido no Render (ver
# render.yaml e IdentificadorDeCliente).
triagem.custo.proxies-confiaveis=${PROXIES_CONFIAVEIS:0}
triagem.custo.cabecalho-do-ip=${CABECALHO_DO_IP:}
triagem.custo.intervalo-da-limpeza=${LIMPEZA_INTERVALO:1h}

# --- Nova tentativa (falhas transitorias: 5xx, 408, 429, tempo esgotado) ---
# Tres tentativas no total: a primeira e mais duas.
triagem.repeticao.tentativas=${REPETICAO_TENTATIVAS:3}
# 1s antes da segunda tentativa, 2s antes da terceira, com variacao aleatoria.
triagem.repeticao.espera-inicial=${REPETICAO_ESPERA_INICIAL:1s}
# Teto de qualquer espera. Se o Retry-After pedir mais que isso (cota do minuto
# esgotada, por exemplo), o worker nao espera: a falha segue adiante na hora.
triagem.repeticao.espera-maxima=${REPETICAO_ESPERA_MAXIMA:10s}

# O OpenAiChatModel escreve o prompt inteiro no log em alguns avisos — e o prompt
# contem o texto do chamado, que pode ter dados pessoais. Os erros continuam
# aparecendo; a falha de cada chamado e registrada pelo TriadorDeChamados, sem o
# texto.
logging.level.org.springframework.ai.openai.OpenAiChatModel=ERROR

# --- Worker de triagem ---
triagem.worker.habilitado=${WORKER_HABILITADO:true}
triagem.worker.intervalo=${WORKER_INTERVALO:2s}
# Maior que a triagem mais demorada possivel: se a reserva vencesse com a triagem
# ainda em andamento, outro worker pegaria o mesmo chamado e o provedor seria pago
# duas vezes. Com os valores acima, o pior caso e, para cada um dos 2 provedores,
# 2 chamadas x (3 x 15s + 2 x 10s) = 130s; 260s no total. A ConferenciaDaReserva
# recusa subir se a conta nao fechar.
triagem.worker.reserva=${WORKER_RESERVA:5m}
triagem.worker.maximo-por-rodada=${WORKER_MAXIMO_POR_RODADA:10}

# --- Revisao de pendentes ---
# Quando uma rodada inteira de triagem falha (todos os provedores fora, cota do
# dia esgotada), o chamado fica pendente e ganha uma nova tentativa agendada, com
# espera crescente: 5 minutos depois da primeira falha, 30 depois da segunda, 2
# horas depois da terceira. Depois da quarta, espera so uma pessoa.
triagem.revisao.esperas=${REVISAO_ESPERAS:5m,30m,2h}
# Um pendente ja esperou minutos; procura-lo a cada poucos segundos, como o
# worker faz com os novos, so gastaria consultas ao banco.
triagem.revisao.intervalo=${REVISAO_INTERVALO:1m}
triagem.revisao.maximo-por-rodada=${REVISAO_MAXIMO_POR_RODADA:5}
