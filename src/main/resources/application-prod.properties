# Perfil de producao, no Render.
#
# O grupo declarado em application.properties (spring.profiles.group.prod=docker)
# faz o perfil "docker" tambem ficar ativo: log estruturado em JSON e health sem
# detalhes vem de la. Aqui ficam so as diferencas de producao.

# --- Banco (Neon) ---
# A instancia gratuita do Render tem 512 MB e o plano gratuito do Neon limita as
# conexoes simultaneas. Cinco sobram: o worker e o revisor usam uma conexao por
# vez, e a API faz consultas curtas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# O Neon suspende o banco depois de alguns minutos ocioso. A primeira conexao
# seguinte espera ele acordar, o que passa dos 3 segundos que valem localmente.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}

# --- Worker ---
# A instancia gratuita hiberna depois de 15 minutos sem trafego. Consultar a fila
# a cada 2 segundos so para encontrar zero chamados gasta computacao do Neon
# sem entregar nada; 5 segundos ainda deixam a demonstracao responsiva.
triagem.worker.intervalo=${WORKER_INTERVALO:5s}
